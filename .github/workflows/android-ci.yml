name: Android CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test-and-build:
    name: Unit Tests & Debug Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  instrumented-tests:
    name: Instrumented Tests (Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew

      - name: Enable KVM for hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compile Android instrumented tests
        run: ./gradlew :app:compileDebugAndroidTestKotlin --no-daemon

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: Nexus 6
          # AVD is pre-cached; no-window keeps CI lean.
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Root cause fix: reactivecircus passes the script body to /bin/sh on some
          # runners, which does not support 'pipefail'. We explicitly invoke bash so
          # that 'set -euo pipefail' is valid. The readiness checks below guard against
          # transient "adb: device offline" messages that occur during emulator boot;
          # they are not failures once boot_completed=1.
          script: |
            bash <<'BASH'
            set -euo pipefail

            echo "--- ADB readiness check ---"
            adb devices
            adb wait-for-device
            # Poll until sys.boot_completed == 1 (up to ~60 s).
            BOOT_COMPLETED=""
            for i in $(seq 1 30); do
              BOOT_COMPLETED=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              if [ "$BOOT_COMPLETED" = "1" ]; then
                echo "Emulator boot_completed=1 (ready)."
                break
              fi
              echo "  Waiting for boot... attempt $i (boot_completed='$BOOT_COMPLETED')"
              sleep 2
            done

            if [ "$BOOT_COMPLETED" != "1" ]; then
              echo "ERROR: Emulator did not report boot_completed=1 within timeout." >&2
              exit 1
            fi

            echo "--- Running connected instrumented tests ---"
            ./gradlew connectedDebugAndroidTest --no-daemon
            BASH

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          retention-days: 7
