name: Android CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test-and-build:
    name: Unit Tests & Debug Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  instrumented-tests:
    name: Instrumented Tests (Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew

      - name: Enable KVM for hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compile Android instrumented tests
        run: ./gradlew :app:compileDebugAndroidTestKotlin --no-daemon

      - name: Prepare instrumented test script
        # The reactivecircus/android-emulator-runner action executes the 'script:'
        # field by running each line individually via '/usr/bin/sh -c <line>'.
        # Dash (sh) does not support 'set -o pipefail', so any multi-line bash
        # script embedded directly in 'script:' will fail immediately.
        # Solution: write the test runner as a real bash script here (under the
        # runner's own bash shell), then the emulator-runner step calls it with a
        # single 'bash /tmp/...' invocation that sh can forward without issue.
        run: |
          cat > /tmp/run-instrumented-tests.sh << 'BASH'
          #!/usr/bin/env bash
          set -euo pipefail

          # The emulator-runner action already polls sys.boot_completed and sends
          # keyevent 82 (unlock) before invoking this script, so we just run tests.
          echo "--- Running connected instrumented tests ---"
          ./gradlew connectedDebugAndroidTest --no-daemon
          BASH
          chmod +x /tmp/run-instrumented-tests.sh

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: Nexus 6
          # AVD is pre-cached; no-window keeps CI lean.
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # The action handles emulator boot polling internally (waits for
          # sys.boot_completed=1) before invoking the script below.  We call the
          # pre-written bash script with a single token so sh can forward it cleanly.
          script: bash /tmp/run-instrumented-tests.sh

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          retention-days: 7
