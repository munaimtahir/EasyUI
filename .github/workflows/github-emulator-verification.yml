name: GitHub Android Emulator Verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/**
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_MODULE: app
  PACKAGE_NAME: com.easyui.launcher.debug
  MAIN_ACTIVITY: com.easyui.launcher.MainActivity
  DEBUG_APK_PATH: app/build/outputs/apk/debug/app-debug.apk
  ADB_EVIDENCE_DIR: build/github-emulator-evidence

jobs:
  build-unit-lint:
    name: Build, Unit Tests, Lint
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew

      - name: Record project structure evidence
        if: always()
        shell: bash
        run: |
          mkdir -p build/github-static-evidence
          {
            echo "# Project discovery"
            echo
            echo "## Root files"
            find . -maxdepth 2 -type f | sort | sed 's#^./##' | head -300
            echo
            echo "## Gradle wrapper"
            cat gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true
            echo
            echo "## settings.gradle*"
            cat settings.gradle 2>/dev/null || true
            cat settings.gradle.kts 2>/dev/null || true
            echo
            echo "## build.gradle*"
            cat build.gradle 2>/dev/null || true
            cat build.gradle.kts 2>/dev/null || true
            echo
            echo "## module build.gradle*"
            cat ${APP_MODULE}/build.gradle 2>/dev/null || true
            cat ${APP_MODULE}/build.gradle.kts 2>/dev/null || true
            echo
            echo "## AndroidManifest"
            cat ${APP_MODULE}/src/main/AndroidManifest.xml 2>/dev/null || true
          } > build/github-static-evidence/project-discovery.txt

      - name: Build debug APK
        run: ./gradlew :${APP_MODULE}:assembleDebug --no-daemon --stacktrace

      - name: Run local unit tests
        run: ./gradlew :${APP_MODULE}:testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android lint
        run: ./gradlew :${APP_MODULE}:lintDebug --no-daemon --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: |
            ${{ env.DEBUG_APK_PATH }}
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
            **/build/reports/lint-results-*.txt
            **/build/intermediates/lint_intermediate_text_report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload static evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-project-evidence
          path: build/github-static-evidence/
          if-no-files-found: warn
          retention-days: 14

  emulator-verification:
    name: Emulator Instrumented, ADB Smoke, Screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: build-unit-lint
    if: always()
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant executable permissions
        shell: bash
        run: |
          chmod +x ./gradlew
          chmod +x scripts/adb/*.sh || true

      - name: Enable KVM for hardware acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK and compile instrumented tests
        run: |
          ./gradlew :${APP_MODULE}:assembleDebug --no-daemon --stacktrace
          ./gradlew :${APP_MODULE}:compileDebugAndroidTestKotlin --no-daemon --stacktrace || ./gradlew :${APP_MODULE}:compileDebugAndroidTestJavaWithJavac --no-daemon --stacktrace || true

      - name: Prepare emulator verification runner
        shell: bash
        run: |
          cat > /tmp/run-emulator-verification.sh << 'BASH'
          #!/usr/bin/env bash
          set -uo pipefail

          EXIT_CODE=0
          mkdir -p "${ADB_EVIDENCE_DIR:-build/github-emulator-evidence}"

          echo "--- Emulator environment ---" | tee "${ADB_EVIDENCE_DIR}/00_environment.txt"
          adb devices -l | tee -a "${ADB_EVIDENCE_DIR}/00_environment.txt" || EXIT_CODE=$?
          adb shell getprop ro.build.version.release | tee -a "${ADB_EVIDENCE_DIR}/00_environment.txt" || true
          adb shell getprop ro.product.model | tee -a "${ADB_EVIDENCE_DIR}/00_environment.txt" || true

          echo "--- ADB smoke test ---"
          bash scripts/adb/adb_smoke_test.sh "${DEBUG_APK_PATH}" "${PACKAGE_NAME}" "${MAIN_ACTIVITY}" || EXIT_CODE=$?

          echo "--- Instrumented tests ---"
          ./gradlew :${APP_MODULE}:connectedDebugAndroidTest --no-daemon --stacktrace | tee "${ADB_EVIDENCE_DIR}/connectedDebugAndroidTest.txt" || EXIT_CODE=$?

          echo "--- Screenshot capture ---"
          bash scripts/adb/adb_capture_screenshots.sh "${PACKAGE_NAME}" "${MAIN_ACTIVITY}" || true

          echo "--- Evidence collection ---"
          bash scripts/adb/adb_collect_evidence.sh "${PACKAGE_NAME}" || true

          exit "$EXIT_CODE"
          BASH
          chmod +x /tmp/run-emulator-verification.sh

      - name: Run emulator verification suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash /tmp/run-emulator-verification.sh

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adb-emulator-evidence
          path: |
            build/github-emulator-evidence/
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload emulator APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-built-debug-apk
          path: |
            ${{ env.DEBUG_APK_PATH }}
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
