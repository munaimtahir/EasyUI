services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    # Published on the host so the shared, host-level Caddy instance
    # (/etc/caddy/Caddyfile) can reverse_proxy 127.0.0.1:8088 -> this
    # container. Port 8088 is dedicated to easyui and reserved there
    # alongside every other app's port (see BACKEND_DEPLOYMENT.md).
    ports:
      - "8088:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - EASYUI_ENV=production
      - EASYUI_STORAGE_FILE=/data/easyui_store.json
      - EASYUI_SEED_DEV_TOKENS=false
    volumes:
      - easyui_data:/data
    networks:
      - easyui_net

volumes:
  easyui_data:

networks:
  easyui_net:
    driver: bridge
