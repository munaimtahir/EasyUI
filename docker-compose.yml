version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - EASYUI_ENV=production
      - EASYUI_STORAGE_FILE=/data/easyui_store.json
      - EASYUI_SEED_DEV_TOKENS=false
    volumes:
      - easyui_data:/data
    networks:
      - easyui_net

  caddy:
    image: caddy:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-api.easyui.app}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - easyui_net

volumes:
  easyui_data:
  caddy_data:
  caddy_config:

networks:
  easyui_net:
    driver: bridge
